    />

    <!-- distant mountain -->
    <path
        d="
            M0 500
            L120 390
            L205 450
            L335 270
            L450 405
            L555 320
            L690 450
            L820 300
            L970 430
            L1080 350
            L1200 470
            L1200 700
            L0 700
            Z
        "
        fill="#D4DCC9"
    />

    <!-- main mountain -->
    <path
