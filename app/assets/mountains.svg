            M0 610
            L170 465
            L275 535
            L500 155
            L730 495
            L820 415
            L1010 555
            L1100 485
            L1200 555
            L1200 700
            L0 700
            Z
        "
        fill="#98A682"
    />

    <!-- mountain shadow -->
    <path
        d="
            M500 155
            L730 495
            L620 410
            L555 340
            L500 155
            Z
        "
        fill="#7F8F69"
